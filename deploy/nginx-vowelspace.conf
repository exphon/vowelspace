# vowelspace.tyoon.net — Vowel Space Visualizer 리버스 프록시 (HTTP 리디렉션 + HTTPS)

server {
    listen 80;
    listen [::]:80;

    server_name vowelspace.tyoon.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name vowelspace.tyoon.net;

    ssl_certificate /etc/letsencrypt/live/vowelspace.tyoon.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vowelspace.tyoon.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/vowelspace-access.log;
    error_log /var/log/nginx/vowelspace-error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WAV 업로드(최대 100MB)와 포먼트 분석 시간을 고려한 설정
        client_max_body_size 100m;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_connect_timeout 60;
    }
}
